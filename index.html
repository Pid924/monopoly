<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Monopoly</title>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<style>@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;600;700&display=swap');</style>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Georgia','Noto Sans Thai',serif;background:#2d5016;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding:12px 16px 16px;gap:10px}

/* ── BOARD ── */
#board-container{position:relative;width:782px;height:782px;flex-shrink:0}
#board{transform-style:preserve-3d;width:782px;height:782px;display:grid;grid-template-columns:112px repeat(9,62px) 112px;grid-template-rows:112px repeat(9,62px) 112px;border:3px solid #1b3a0a;background:#f5f0dc;font-family:'Georgia',serif}

/* cells */
.cell{border:1px solid #1b3a0a;position:relative;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center}
.cell .cname{font-family:'Georgia','Noto Sans Thai',serif;font-size:8px;text-align:center;line-height:1.25;color:#111;padding:0 3px;word-break:break-word}
.cell .cprice{font-size:7.5px;color:#333;font-family:monospace;margin-top:1px}
.cell .cicon{font-size:19px;line-height:1;margin-bottom:1px}
/* clickable squares */
.cell.inspectable{cursor:pointer}
.cell.inspectable:hover{filter:brightness(1.08)}
.cell.inspectable:hover::before{
  content:'';position:absolute;inset:0;z-index:3;pointer-events:none;
  box-shadow:inset 0 0 0 2px rgba(27,58,10,.55);
}
.cell.inspectable:active{filter:brightness(.95)}

/* Color bands – absolutely positioned flush to outer board edge */
.cell.side-bottom .band{position:absolute;bottom:0;left:0;width:100%;height:20px;border-top:1px solid #1b3a0a;}
.cell.side-top    .band{position:absolute;top:0;left:0;width:100%;height:20px;border-bottom:1px solid #1b3a0a;}
.cell.side-right  .band{position:absolute;left:0;top:0;height:100%;width:20px;border-right:1px solid #1b3a0a;}
.cell.side-left   .band{position:absolute;right:0;top:0;height:100%;width:20px;border-left:1px solid #1b3a0a;}
/* inner content wrapper for side cells */
.cell.side-right .inner,.cell.side-left .inner{
  flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:0;
}

/* corner cells */
.corner{background:#f5f0dc}
.corner-go{background:#d4edda}
.corner-jail{background:#ffe0b2}
.corner-park{background:#e8f5e9}
.corner-gtj{background:#ffccbc}
.corner .corner-label{font-size:12px;font-weight:700;text-align:center;line-height:1.25;color:#1b3a0a;text-transform:uppercase;letter-spacing:.5px}
.corner .corner-icon{font-size:34px;margin-bottom:5px}

/* special cells */
.cell-chance{background:#fffde7}
.cell-chest{background:#fce4ec}
.cell-tax{background:#f3e5f5}

/* center */
#center{transform-style:preserve-3d;position:relative;z-index:1;grid-column:2/11;grid-row:2/11;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;background:#f5f0dc;padding:10px}
#center-logo{font-size:44px;font-weight:700;color:#1b3a0a;letter-spacing:7px;text-transform:uppercase;font-style:italic;text-align:center;line-height:1.1;border:4px solid #1b3a0a;padding:10px 24px}
#center-sub{font-size:11px;letter-spacing:3px;color:#555;text-transform:uppercase}
#dice-area{display:flex;gap:24px;margin-top:10px;perspective:400px;transform-style:preserve-3d}

/* ── 3D DICE ── */
.die-wrap{position:relative;width:56px;height:56px;perspective:280px;cursor:default;
  transform-style:preserve-3d;
  transition:transform .6s cubic-bezier(.4,0,.2,1);
  /* rest ON the board so the rolled value is the TOP face.
     Only the spin is countered, so the pips stay square to the viewer. */
  transform:translateZ(var(--dice-lift,0px))
            rotateZ(calc(-1 * var(--board-rot,0deg)));
}
/* shadow the dice cast on the board when they're floating above it */
.die-wrap::after{
  content:'';position:absolute;left:8%;top:78%;width:84%;height:16px;
  background:rgba(0,0,0,.32);filter:blur(6px);border-radius:50%;
  transform:translateZ(calc(-1 * var(--dice-lift,0px) - 1px));
  opacity:var(--dice-shadow,0);transition:opacity .6s;pointer-events:none;
}
.die-inner{
  width:56px;height:56px;
  position:relative;transform-style:preserve-3d;
  transition:transform .1s;
  transform:rotateX(0deg) rotateY(0deg);
}
/* rolling animation: fast random tumble then settle */
@keyframes tumble{
  0%  {transform:rotateX(0deg)   rotateY(0deg)   rotateZ(0deg)}
  15% {transform:rotateX(360deg) rotateY(180deg) rotateZ(90deg)}
  30% {transform:rotateX(180deg) rotateY(540deg) rotateZ(180deg)}
  50% {transform:rotateX(540deg) rotateY(360deg) rotateZ(270deg)}
  70% {transform:rotateX(720deg) rotateY(720deg) rotateZ(360deg)}
  85% {transform:rotateX(810deg) rotateY(810deg) rotateZ(380deg)}
  95% {transform:rotateX(830deg) rotateY(830deg) rotateZ(390deg)}
  100%{transform:rotateX(var(--rx)) rotateY(var(--ry)) rotateZ(0deg)}
}
.die-inner.rolling{animation:tumble .9s cubic-bezier(.25,.46,.45,.94) forwards}

/* 6 faces */
.die-face{
  position:absolute;width:56px;height:56px;
  background:#fff;border:1px solid #d0d0d0;border-radius:9px;
  display:grid;
  grid-template-columns:repeat(3,1fr);
  grid-template-rows:repeat(3,1fr);
  padding:7px;
  box-shadow:inset 0 -3px 6px rgba(0,0,0,.08),inset 0 2px 4px rgba(255,255,255,.9);
  backface-visibility:hidden;
}
.die-face.f1{transform:translateZ(28px)}
.die-face.f6{transform:rotateY(180deg) translateZ(28px)}
.die-face.f2{transform:rotateY(-90deg) translateZ(28px)}
.die-face.f5{transform:rotateY(90deg)  translateZ(28px)}
.die-face.f3{transform:rotateX(90deg)  translateZ(28px)}
.die-face.f4{transform:rotateX(-90deg) translateZ(28px)}

/* pips – standard die layouts on a 3×3 grid */
.pip{width:10px;height:10px;border-radius:50%;
  background:radial-gradient(circle at 35% 30%,#555,#111 70%);
  justify-self:center;align-self:center;
  box-shadow:inset 0 1px 1px rgba(255,255,255,.25);
}
/* faces 1 and 4 use red pips (Asian dice convention) */
.pip.red{background:radial-gradient(circle at 35% 30%,#e74c3c,#a01010 70%)}
/* grid positions: row / column */
.p-tl{grid-area:1/1}   /* top-left */
.p-tr{grid-area:1/3}   /* top-right */
.p-ml{grid-area:2/1}   /* mid-left */
.p-mc{grid-area:2/2}   /* center */
.p-mr{grid-area:2/3}   /* mid-right */
.p-bl{grid-area:3/1}   /* bottom-left */
.p-br{grid-area:3/3}   /* bottom-right */

/* result flash */
@keyframes dieSettle{0%{filter:brightness(1.8)}100%{filter:brightness(1)}}
.die-inner.settled{animation:dieSettle .4s ease-out forwards}

/* ── PIECES ── */
.piece{position:absolute;width:26px;height:26px;border-radius:50%;border:2.5px solid white;
  display:flex;align-items:center;justify-content:center;font-size:16px;line-height:1;
  z-index:10;pointer-events:none;transform-style:preserve-3d;
  box-shadow:0 3px 10px rgba(0,0,0,.55),
             inset 0 -2px 4px rgba(0,0,0,.30),
             inset 0 2px 3px rgba(255,255,255,.35);
  transition:left .6s cubic-bezier(.34,1.56,.64,1),top .6s cubic-bezier(.34,1.56,.64,1)}
.piece.hopping{animation:hop .35s ease-out}
/* keep the token emoji upright while the board spins */
.piece-face{display:block;line-height:1;
  transition:transform .6s cubic-bezier(.4,0,.2,1);
  transform-style:preserve-3d;
  /* spin back against the board, then stand perpendicular to it */
  transform:rotateZ(var(--token-counter,0deg))
            rotateX(calc(-1 * var(--tilt,0deg)))
            translateY(calc(-1 * var(--tok-rise,0px)));
}
/* the pedestal the standing token sits on (3D view only) */
.piece-face::before{
  content:'';position:absolute;left:50%;top:100%;
  width:14px;height:var(--tok-rise,0px);margin-left:-7px;
  background:linear-gradient(to right,rgba(0,0,0,.35),rgba(255,255,255,.25),rgba(0,0,0,.35));
  border-radius:0 0 3px 3px;opacity:var(--tok-solid,0);transition:opacity .6s;
}
/* contact shadow on the square beneath the token */
.piece::after{
  content:'';position:absolute;left:15%;top:64%;width:70%;height:9px;
  background:rgba(0,0,0,.4);filter:blur(4px);border-radius:50%;
  opacity:var(--tok-solid,0);transition:opacity .6s;
  transform:translateZ(-2px);          /* real depth, not z-index */
  pointer-events:none;
}
@keyframes hop{0%{transform:scale(1) translateY(0)}40%{transform:scale(1.35) translateY(-16px)}100%{transform:scale(1) translateY(0)}}

/* ── PANEL ── */
#ui{display:flex;gap:16px;width:100%;max-width:1080px;align-items:stretch;flex-wrap:wrap}
#panel{flex:1;min-width:230px;display:flex;flex-direction:column;gap:9px;
  align-self:stretch;min-height:782px}   /* match the board's height */

/* player cards – clickable */
.pcard{background:#f5f0dc;border:1.5px solid #3a7a1a;border-radius:6px;padding:8px 10px;font-size:12px;font-family:sans-serif;cursor:pointer;transition:box-shadow .15s,background .15s;user-select:none}
.pcard:hover{background:#eae5c8;box-shadow:0 2px 8px rgba(0,0,0,.15)}
.pcard.active-turn{border-color:#ff6f00;box-shadow:0 0 0 2px #ff6f0044}
.pcard .pname{font-weight:700;font-size:13px;display:flex;align-items:center;gap:6px}
.pcard .pmoney{color:#444;margin-top:2px}
.pcard .ppos{font-size:10px;color:#888;margin-top:1px}
.pcard .pview{font-size:9px;color:#3a7a1a;margin-top:3px;font-style:italic}

#log{background:#1a3d0a;border:1.5px solid #3a7a1a;border-radius:6px;padding:8px 10px;
  font-size:11px;overflow-y:auto;display:flex;flex-direction:column;gap:2px;font-family:monospace;
  flex:1 1 auto;min-height:130px;}      /* fills down to the bottom of the board */
#log .msg{color:#a5d6a7;line-height:1.4}
#log .msg.imp{color:#fff176;font-weight:700}
#log .msg.sep{color:#4a7a2a}

#controls{display:flex;gap:8px;flex-wrap:wrap}
button{font-size:12px;padding:7px 14px;border-radius:4px;border:2px solid #1b3a0a;background:#f5f0dc;color:#1b3a0a;cursor:pointer;font-family:'Georgia',serif;font-weight:700;letter-spacing:.5px;transition:all .1s;text-transform:uppercase}
button:hover:not(:disabled){background:#1b3a0a;color:#f5f0dc}
button:active:not(:disabled){transform:scale(.97)}
button.primary{background:#1b3a0a;color:#f5f0dc;border-color:#1b3a0a}
button.primary:hover:not(:disabled){background:#2d5016}
button:disabled{opacity:.35;cursor:default}

#prop-card{background:#f5f0dc;border:2px solid #1b3a0a;border-radius:6px;padding:10px;font-size:11px;font-family:sans-serif;display:none;margin-top:4px}
#prop-card .pc-title{font-weight:700;font-size:13px;font-family:'Georgia',serif;margin-bottom:4px}
#prop-card .pc-band{height:10px;border-radius:2px;margin-bottom:6px}
#prop-card table{width:100%;font-size:10px;border-collapse:collapse}
#prop-card td{padding:2px 0;color:#444}
#prop-card td:last-child{text-align:right;font-weight:600;color:#111}

/* ── PORTFOLIO MODAL ── */
#portfolio-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:200;align-items:flex-start;justify-content:center;padding-top:40px}
#portfolio-box{background:#f5f0dc;border:3px solid #1b3a0a;border-radius:10px;width:340px;max-height:80vh;overflow-y:auto;font-family:sans-serif}
#portfolio-header{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;border-bottom:1.5px solid #1b3a0a;position:sticky;top:0;background:#f5f0dc;z-index:1}
#portfolio-header h3{font-family:'Georgia',serif;font-size:16px;color:#1b3a0a;display:flex;align-items:center;gap:8px}
#portfolio-close{background:none;border:none;font-size:18px;cursor:pointer;color:#555;padding:0;line-height:1;font-family:sans-serif;letter-spacing:0;text-transform:none}
#portfolio-close:hover{color:#1b3a0a}
#portfolio-body{padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.port-empty{color:#888;font-size:12px;text-align:center;padding:16px 0}
.port-prop{border:1px solid #ccc;border-radius:6px;overflow:hidden;font-size:11px}
.port-prop .pp-band{height:8px}
.port-prop .pp-info{padding:6px 8px}
.port-prop .pp-name{font-weight:700;font-size:12px;color:#111;margin-bottom:2px;display:flex;align-items:center;gap:5px;flex-wrap:wrap}
.port-prop .pp-group{font-size:10px;color:#888;margin-bottom:5px}
.pp-monopoly-badge{color:white;font-size:9px;padding:2px 6px;border-radius:3px;font-weight:700;letter-spacing:.5px;flex-shrink:0}
.pp-table{width:100%;font-size:10px;border-collapse:collapse}
.pp-table tr{border-top:1px solid #e8e0cc}
.pp-table td{padding:3px 2px;color:#555}
.pp-table td.pp-val{text-align:right;color:#333}
.port-section-title{font-size:10px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:#888;margin-top:4px}
/* sell button inside portfolio */
.pp-sell-btn{margin-top:6px;width:100%;padding:5px 0;font-size:10px;font-family:'Georgia',serif;font-weight:700;letter-spacing:.5px;text-transform:uppercase;background:#fff3e0;border:1.5px solid #e65100;color:#e65100;border-radius:4px;cursor:pointer;transition:all .15s}
.pp-sell-btn:hover{background:#e65100;color:white}
/* broke banner */
#broke-banner{display:none;background:#b71c1c;color:white;font-family:sans-serif;font-size:12px;font-weight:700;padding:8px 12px;border-radius:6px;text-align:center;line-height:1.5}
#broke-banner button{margin-top:6px;font-size:11px;padding:4px 12px;background:white;color:#b71c1c;border:none;border-radius:4px;cursor:pointer;font-weight:700;font-family:sans-serif;letter-spacing:0;text-transform:none}
#broke-banner button:hover{background:#ffcdd2}

/* setup */
#setup{background:#f5f0dc;border:2px solid #1b3a0a;border-radius:8px;padding:20px;text-align:center;font-family:sans-serif;width:260px}
#setup h2{font-family:'Georgia',serif;font-size:18px;color:#1b3a0a;margin-bottom:12px}
#setup .btns{display:flex;gap:8px;justify-content:center}

/* winner */
#winner{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:300;align-items:center;justify-content:center}
#winner-box{background:#f5f0dc;border:4px solid #1b3a0a;border-radius:12px;padding:32px 40px;text-align:center;font-family:sans-serif;max-width:320px}
#winner-box h2{font-family:'Georgia',serif;font-size:24px;color:#1b3a0a;margin-bottom:8px}
#winner-box p{color:#555;margin-bottom:16px}

/* ── 3D VIEW ── */
#scene{perspective:900px;perspective-origin:50% 10%}
#board-container{
  transform-style:preserve-3d;
  transition:transform .6s cubic-bezier(.4,0,.2,1),box-shadow .6s;
}
#board-container.view3d{
  transform:rotateX(50deg) rotateZ(calc(-2deg + var(--board-rot,0deg))) scale(0.92);
  box-shadow:0 60px 80px rgba(0,0,0,.55),0 20px 30px rgba(0,0,0,.4);
}
/* fake board thickness when 3d */
#board-container.view3d::after{
  content:'';
  position:absolute;
  inset:0;
  transform:translateZ(-18px);
  background:#8B6914;
  border-radius:3px;
  pointer-events:none;
  box-shadow:0 0 0 3px #6B4F10;
}
/* ground shadow – lives on the wrapper, OUTSIDE the preserve-3d context,
   so ordinary z-index still applies and it can never paint over the board */
#board-wrap{position:relative}
#board-wrap::after{
  content:'';position:absolute;
  bottom:-34px;left:6%;width:88%;height:38px;
  background:rgba(0,0,0,.32);
  filter:blur(18px);border-radius:50%;
  opacity:0;transition:opacity .6s;
  pointer-events:none;z-index:0;
}
#board-wrap.is3d::after{opacity:1}

/* language bar */
#lang-bar{display:flex;gap:4px;justify-content:center;margin-bottom:12px;flex-wrap:wrap}
#lang-bar button{
  font-size:10px;padding:4px 7px;border-radius:4px;
  border:1.5px solid #c8c0a0;background:transparent;color:#666;
  font-family:sans-serif;font-weight:600;letter-spacing:0;text-transform:none;
  cursor:pointer;transition:all .15s;
}
#lang-bar button:hover{background:#e8e0c8;color:#1b3a0a}
#lang-bar button.active{background:#1b3a0a;color:#f5f0dc;border-color:#1b3a0a}
/* in-game language switcher */
#lang-bar-game{display:flex;gap:4px}
#lang-bar-game button{
  flex:1;font-size:10px;padding:5px 4px;border-radius:5px;
  border:1.5px solid #3a7a1a;background:#f5f0dc;color:#1b3a0a;
  font-family:sans-serif;font-weight:600;letter-spacing:0;text-transform:none;
  cursor:pointer;transition:all .15s;
}
#lang-bar-game button:hover{background:#1b3a0a;color:#f5f0dc}
#lang-bar-game button.active{background:#1b3a0a;color:#f5f0dc}


/* ══ RESPONSIVE ══
   The board is a fixed 782px grid (piece positions are computed in px),
   so instead of reflowing it we scale the whole scene to fit. */
#board-wrap{flex-shrink:0}
#scene{transform-origin:top left}

@media (max-width:1040px){
  #ui{flex-direction:column;align-items:center}
  #panel{width:100%;max-width:782px;min-height:0}
  #log{flex:0 0 auto;height:160px}
  .tb-brand{font-size:15px;letter-spacing:2px}
}

@media (max-width:720px){
  body{padding:8px 8px 14px;gap:8px}
  #topbar{gap:6px;padding:7px 8px;justify-content:center}
  .tb-brand{width:100%;text-align:center;margin-right:0;font-size:14px;letter-spacing:2px}
  .tb-group{flex:1;justify-content:center}
  .tb-group button{padding:6px 8px;font-size:10px}
  #lang-bar-game button{padding:6px 7px;font-size:10px}
  #log{height:140px;font-size:10px}
  .pcard{font-size:11px;padding:7px 9px}
  .pcard .pview{display:none}          /* tap target is the whole card anyway */
  #setup{width:100%;max-width:320px}
  #card-box{width:92vw;max-width:320px}
  #portfolio-box{width:92vw;max-width:340px}
  #room-code{font-size:26px;letter-spacing:6px}
}

/* the board is scaled down on phones, so bump its type to compensate.
   Prices are dropped to give the names room – tap any square for the full deed. */
@media (max-width:720px){
  .cell .cname{font-size:10.5px;line-height:1.12}
  .cell .cprice{display:none}
  .cell .cicon{font-size:24px}
  .corner .corner-label{font-size:15px;line-height:1.15}
  .corner .corner-icon{font-size:40px;margin-bottom:2px}
  .corner .corner-label span{font-size:11px !important}
  #center-logo{font-size:56px;letter-spacing:8px;padding:12px 28px}
  #center-sub{font-size:15px}
  .center-roll{font-size:22px;padding:14px 34px;letter-spacing:2px}
  #turn-hint{font-size:15px}
  .die-wrap{width:70px;height:70px}
  .piece{width:34px;height:34px;font-size:21px}
}

@media (max-width:420px){
  #topbar{padding:6px}
  .tb-group button{padding:5px 6px;font-size:9px}
  #log{height:120px}
  #toast{font-size:12px;padding:8px 14px;max-width:92vw;white-space:normal;text-align:center}
}

/* bigger tap targets on touch devices */
@media (hover:none){
  #dice-area{padding:10px 14px}
  .center-roll{padding:11px 30px;font-size:15px}
  .cell.inspectable:hover{filter:none}       /* no sticky hover on touch */
  .cell.inspectable:hover::before{content:none}
  #card-close,#card-alt{padding:12px 0}
  .pp-sell-btn{padding:9px 0}
}

/* ── TOP TOOLBAR ── */
#topbar{
  width:100%;max-width:1080px;display:flex;align-items:center;gap:12px;
  padding:8px 12px;margin-bottom:4px;
  background:rgba(0,0,0,.22);border:1px solid rgba(255,255,255,.12);
  border-radius:8px;flex-wrap:wrap;
}
.tb-brand{
  font-family:'Georgia',serif;font-style:italic;font-weight:700;
  font-size:17px;letter-spacing:3px;color:#d4f0a0;text-transform:uppercase;
  margin-right:auto;white-space:nowrap;
}
.tb-group{display:flex;gap:5px;flex-wrap:wrap}
.tb-group button{
  font-size:11px;padding:5px 10px;border-radius:5px;
  border:1.5px solid rgba(212,240,160,.45);
  background:rgba(255,255,255,.08);color:#e8f5d0;
  cursor:pointer;font-family:'Georgia',serif;font-weight:700;
  letter-spacing:.5px;text-transform:uppercase;transition:all .15s;white-space:nowrap;
}
.tb-group button:hover{background:rgba(255,255,255,.2);border-color:#d4f0a0}
#lang-bar-game button{
  font-family:sans-serif;font-size:10px;font-weight:600;
  letter-spacing:0;text-transform:none;padding:5px 8px;
}
#lang-bar-game button.active{background:#d4f0a0;color:#1b3a0a;border-color:#d4f0a0}
#restart-btn{border-color:rgba(255,180,160,.5);color:#ffd9cc}
.rot-btn{font-size:15px;line-height:1;padding:3px 10px;letter-spacing:0}
#restart-btn:hover{background:rgba(255,120,90,.28);border-color:#ffb4a0}

/* ── CENTER ROLL CONTROL ── */
#dice-area{cursor:pointer;border-radius:10px;padding:6px 10px;transition:background .15s,transform .15s}
#dice-area:hover{background:rgba(27,58,10,.07)}
#dice-area:active{transform:scale(.96)}
#dice-area.disabled{cursor:default;opacity:.55}
#dice-area.disabled:hover{background:transparent}
#dice-area.ready{animation:dicePulse 1.8s ease-in-out infinite}
@keyframes dicePulse{
  0%,100%{box-shadow:0 0 0 0 rgba(27,58,10,0)}
  50%    {box-shadow:0 0 0 7px rgba(27,58,10,.10)}
}
.center-roll{
  position:relative;transform:translateZ(1px);
  margin-top:12px;padding:9px 26px;font-size:14px;
  background:#1b3a0a;color:#f5f0dc;border:2px solid #1b3a0a;border-radius:6px;
  font-family:'Georgia',serif;font-weight:700;letter-spacing:1.5px;
  text-transform:uppercase;cursor:pointer;transition:all .15s;
  box-shadow:0 3px 8px rgba(0,0,0,.25);
}
.center-roll:hover:not(:disabled){background:#2d5016;transform:translateY(-1px);box-shadow:0 5px 12px rgba(0,0,0,.3)}
.center-roll:active:not(:disabled){transform:translateY(1px);box-shadow:0 2px 4px rgba(0,0,0,.25)}
.center-roll:disabled{opacity:.35;cursor:default;box-shadow:none}
#turn-hint{
  margin-top:7px;font-size:10px;font-family:sans-serif;color:#6b7a5a;
  letter-spacing:.5px;min-height:13px;text-align:center;
}

/* online lobby */
#room-code{font-family:'Georgia',serif;font-size:30px;font-weight:700;letter-spacing:8px;
  color:#1b3a0a;background:#fffdf5;border:2px dashed #3a7a1a;border-radius:6px;
  padding:8px 4px;margin:4px 0;user-select:all;cursor:text}
#lobby-list,#lobby-list-c{display:flex;flex-direction:column;gap:5px}
.lobby-row{display:flex;align-items:center;gap:7px;background:#fffdf5;border:1px solid #ddd6bc;
  border-radius:5px;padding:5px 7px}
.lobby-name{font-family:sans-serif;font-size:11px;font-weight:600;color:#333;text-align:left}
.lobby-name em{color:#3a7a1a;font-size:10px;font-style:normal}
#net-status{font-family:sans-serif;font-size:11px;color:#666;margin-top:8px;min-height:14px}
#net-status.net-err{color:#b71c1c;font-weight:600}
#name-label{display:block;font-family:sans-serif;font-size:11px;font-weight:700;letter-spacing:.5px;
  text-transform:uppercase;color:#7a7a5a;margin-bottom:5px;text-align:left}
#card-waiting{font-family:sans-serif;font-size:11px;color:#888;font-style:italic;margin-bottom:8px;min-height:14px}
#join-code{letter-spacing:3px;font-weight:700;text-align:center}

/* board theme picker */
#theme-label{display:block;font-family:sans-serif;font-size:11px;font-weight:700;
  letter-spacing:.5px;text-transform:uppercase;color:#7a7a5a;margin-bottom:5px;text-align:left}
#theme-select{
  width:100%;padding:7px 9px;font-size:12px;font-family:sans-serif;font-weight:600;
  color:#1b3a0a;background:#fffdf5;border:1.5px solid #3a7a1a;border-radius:5px;
  cursor:pointer;outline:none;
}
#theme-select:focus{border-color:#1b3a0a;box-shadow:0 0 0 2px rgba(58,122,26,.2)}

/* player type setup rows */
#player-setup-list{display:flex;flex-direction:column;gap:6px}
.psetup-row{display:flex;align-items:center;gap:6px;font-family:sans-serif;font-size:11px}
.psetup-token{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;
  border-radius:50%;font-size:14px;border:2px solid #fff;flex-shrink:0;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.psetup-name{flex:1;text-align:left;color:#333;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.psetup-input{
  flex:1;min-width:0;padding:4px 7px;font-size:11px;
  font-family:sans-serif;font-weight:600;color:#222;
  background:#fffdf5;border:1.5px solid #cfc8a8;border-radius:4px;
  outline:none;transition:border-color .15s,background .15s;
}
.psetup-input:focus{border-color:#3a7a1a;background:#fff}
.psetup-input::placeholder{color:#aaa;font-weight:400;font-style:italic}
.psetup-toggle{display:flex;border:1.5px solid #3a7a1a;border-radius:5px;overflow:hidden;flex-shrink:0}
.psetup-toggle button{
  padding:4px 8px;font-size:10px;border:none;background:transparent;color:#3a7a1a;
  font-family:sans-serif;font-weight:700;letter-spacing:0;text-transform:none;cursor:pointer;transition:all .12s;
}
.psetup-toggle button.on{background:#1b3a0a;color:#f5f0dc}
#btn-back{padding:7px 12px}

.ai-badge{font-size:9px;background:#455a64;color:#fff;padding:2px 6px;border-radius:3px;
  font-weight:700;letter-spacing:.5px;margin-left:auto;flex-shrink:0}
.pcard.thinking{border-color:#455a64;box-shadow:0 0 0 2px #455a6455}

#board-toggles{display:flex;gap:8px}
#board-toggles button{
  flex:1;font-size:11px;padding:6px 8px;
  border-radius:5px;border:1.5px solid #3a7a1a;
  background:#f5f0dc;color:#1b3a0a;
  cursor:pointer;font-family:'Georgia',serif;font-weight:700;
  letter-spacing:.5px;text-transform:uppercase;
  transition:all .15s;
}
#board-toggles button:hover{background:#1b3a0a;color:#f5f0dc}

#card-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:350;align-items:center;justify-content:center}
#card-box{
  width:300px;border-radius:12px;overflow:hidden;
  font-family:sans-serif;text-align:center;
  box-shadow:0 20px 50px rgba(0,0,0,.5);
  animation:cardIn .45s cubic-bezier(.34,1.56,.64,1);
}
@keyframes cardIn{
  0%{transform:scale(.4) rotate(-12deg);opacity:0}
  60%{transform:scale(1.06) rotate(2deg);opacity:1}
  100%{transform:scale(1) rotate(0);opacity:1}
}
#card-head{padding:14px;font-family:'Georgia',serif;font-weight:700;font-size:15px;letter-spacing:1px;text-transform:uppercase;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.25)}
/* light headers get no dark shadow */
#card-head.buy,#card-head.chance,#card-head.rent{text-shadow:0 1px 0 rgba(255,255,255,.4)}
/* header backgrounds — no blue; title colour is set per header for contrast */
#card-head.chance{background:#fbc02d;color:#3a2a00}      /* amber  → dark brown text */
#card-head.chest {background:#c2185b;color:#fff}          /* crimson→ white text      */
#card-head.tax   {background:#6a1b9a;color:#fff}          /* purple → white text      */
#card-head.rent  {background:#e0c9a6;color:#5a2e0a;        /* sand   → dark brown text */
                  border-bottom:2px solid #8a5a28}
#card-head.jail  {background:#37474f;color:#fff}          /* slate  → white text      */
#card-head.go    {background:#2e7d32;color:#fff}          /* green  → white text      */
#card-head.buy   {background:#e8dcc0;color:#1b3a0a;        /* parchment → dark green   */
                  border-bottom:2px solid #1b3a0a}
#card-body{background:#f5f0dc;padding:24px 20px}
#card-icon{font-size:42px;margin-bottom:12px;line-height:1}
#card-text{font-size:15px;color:#1b3a0a;line-height:1.5;font-family:'Georgia',serif;margin-bottom:8px}
#card-effect{font-size:13px;font-weight:700;font-family:monospace;margin-bottom:16px;min-height:16px}
#card-effect.gain{color:#2e7d32}
#card-effect.loss{color:#c62828}
#card-effect.move{color:#1b5e20}
#card-btns{display:flex;gap:8px}
#card-close{
  flex:1;padding:9px 0;font-size:13px;
  background:#1b3a0a;color:#f5f0dc;border:none;border-radius:5px;
  font-family:'Georgia',serif;font-weight:700;letter-spacing:1px;
  text-transform:uppercase;cursor:pointer;transition:background .15s;
}
#card-close:hover{background:#2d5016}
#card-alt{
  flex:1;padding:9px 0;font-size:13px;
  background:transparent;color:#777;border:2px solid #bbb;border-radius:5px;
  font-family:'Georgia',serif;font-weight:700;letter-spacing:1px;
  text-transform:uppercase;cursor:pointer;transition:all .15s;
}
#card-alt:hover{background:#ddd;color:#333}
/* deed table shown when buying */
#card-deed{margin:0 0 14px;width:100%;font-size:11px;border-collapse:collapse;font-family:sans-serif;display:none}
#card-deed tr{border-top:1px solid #ddd6bc}
#card-deed td{padding:3px 4px;color:#666;text-align:left}
#card-deed td:last-child{text-align:right;font-weight:600;color:#222}
#card-band{height:12px;border-radius:3px;margin-bottom:10px;display:none}

@media (max-width:1000px){
  #panel{min-height:0}
  #log{flex:0 0 auto;height:180px}
}
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#1b3a0a;color:#f5f0dc;padding:10px 20px;border-radius:6px;font-family:sans-serif;font-size:13px;font-weight:600;opacity:0;transition:opacity .3s;pointer-events:none;z-index:400;white-space:nowrap}
#toast.show{opacity:1}

let LANG='en';
function t(k){ const L=LANGS[LANG]; return (L&&L[k]!==undefined)?L[k]:(LANGS.en[k]!==undefined?LANGS.en[k]:k); }

// translated display name for a board square
function sqName(i){
  const sq=SQ[i];
  const map={go:'GO',jail:'JAIL',free:'FREE',gotojail:'GOTOJAIL',chance:'CHANCE',chest:'CHEST'};
  if(map[sq.t]) return t(map[sq.t]);
  if(sq.t==='tax') return sq.n.indexOf('Luxury')>=0?t('LUXURYTAX'):t('INCOMETAX');
  return sq.n;  // street / station / utility names stay as printed
}
function grpName(c){
  const m={brown:'grpBrown',lb:'grpLb',pink:'grpPink',orange:'grpOrange',
           red:'grpRed',yellow:'grpYellow',green:'grpGreen',dblue:'grpDblue'};
  return t(m[c]||c);
}

function setLang(code){
  LANG=code;
  document.documentElement.lang=code;
  document.querySelectorAll('#lang-bar button, #lang-bar-game button').forEach(b=>
    b.classList.toggle('active', b.dataset.lang===code));
  applyLang();
  if(players.length){
    // remember what the dice are currently showing so a rebuild doesn't wipe them
    const faces=[1,2].map(n=>{
      const el=document.getElementById('d'+n);
      const f=el&&el.querySelector('.die-face.f1');
      return f?f.innerHTML:null;
    });
    buildBoard();
    faces.forEach((html,i)=>{
      if(!html) return;
      const f=document.getElementById('d'+(i+1));
      const front=f&&f.querySelector('.die-face.f1');
      if(front) front.innerHTML=html;
    });
    repositionAll();
    renderPlayers();
    updateRollLabel();
    applyBoardRotation();
    fitBoard();
  }
  if(lastEvent) showEvent(lastEvent.opts, lastEvent.onOk, lastEvent.onAlt, true); // retranslate live popup, silently
  if(portfolioOpen&&portfolioOpen()) openPortfolio(portfolioPlayer);
  if(typeof SFX!=='undefined') SFX.click();
}
function repositionAll(){ players.forEach((p,i)=>{ if(p.el) placePiece(p,p.pos,i); }); }

function sqPos(i){
  if(i<=10) return{col:10-i,row:10,side:'bottom'};
  if(i<=20) return{col:0,row:10-(i-10),side:'right'};
  if(i<=30) return{col:i-20,row:0,side:'top'};
  return{col:10,row:i-30,side:'left'};
}
function sqPixelCenter(i){
  const{col,row}=sqPos(i);
  const cw=c=>c===0||c===10?112:62;
  const rh=r=>r===0||r===10?112:62;
  let x=0;for(let c=0;c<col;c++)x+=cw(c);
  let y=0;for(let r=0;r<row;r++)y+=rh(r);
  return{x:x+cw(col)/2,y:y+rh(row)/2};
}

function buildBoard(){
  const board=document.getElementById('board');
  board.innerHTML='';
  const cells=[];
  for(let r=0;r<11;r++)cells.push([]);
  for(let i=0;i<40;i++){
    const{col,row,side}=sqPos(i);
    cells[row][col]=makeCell(i,SQ[i],side);
  }
  const centerDiv=document.createElement('div');

  }else if(sq.t==='rail'){
    inner=`<div class="inner"><div class="cicon">🚂</div><div class="cname">${sq.n}</div><div class="cprice">$${sq.p}</div></div>`;

  return d;

/* ══════════════════════════════════════════════════════════════
   ONLINE MULTIPLAYER  (PeerJS, host-authoritative)

   The host's browser runs every rule. Clients are thin renderers:
   they send intents ("I clicked roll") and draw whatever the host
   sends back. That keeps one copy of the rules, so the game can
   never disagree with itself.
   ══════════════════════════════════════════════════════════════ */
const NET={
  mode:'local',        // 'local' | 'host' | 'client'
  peer:null,
  conns:[],            // host: one per client
  hostConn:null,       // client: link back to host
  seat:-1,             // which player index this browser controls
  roomId:null,
  lobby:[],            // host: [{seat,name,conn}]
  myName:'',
  hostName:'',
  transport:null,      // test hook – lets the suite swap PeerJS out

  isHost(){ return this.mode==='host'; },
  isClient(){ return this.mode==='client'; },
  isOnline(){ return this.mode!=='local'; },

  /* this browser may act only on the seat it owns */
  controlsSeat(i){
    if(this.mode==='local') return true;
    return i===this.seat;
  },
  myTurn(){ return this.controlsSeat(current); },

  send(msg){                                   // client → host
    if(this.transport) return this.transport.toHost(msg);
    if(this.hostConn&&this.hostConn.open) this.hostConn.send(msg);
  },
  broadcast(msg){                              // host → all clients
    if(this.transport) return this.transport.toClients(msg);
    this.conns.forEach(c=>{ if(c.open) c.send(msg); });
  },
};

/* ── STATE SNAPSHOT ───────────────────────────────────────────
   Everything a client needs to draw the game. Deliberately small:
   the board layout is identical on every machine, so only the
   mutable parts travel. */
function snapshot(){
  return {
    theme:THEME,
    players:players.map(p=>({
      name:p.name, color:p.color, initial:p.initial, isAI:p.isAI,
      pos:p.pos, money:p.money, jail:p.jail, jailT:p.jailT,
      bankrupt:p.bankrupt, props:p.props.slice()
    })),
    current, rolled, moving, turnEnding, doublesCount, lastWasDoubles
  };
}

function applySnapshot(s){
  if(s.theme&&s.theme!==THEME) applyTheme(s.theme);
  const fresh=(players.length!==s.players.length);
  s.players.forEach((sp,i)=>{
    let p=players[i];
    if(!p){ p=players[i]={el:null}; }
    Object.assign(p,{
      name:sp.name,color:sp.color,initial:sp.initial,isAI:sp.isAI,
      pos:sp.pos,money:sp.money,jail:sp.jail,jailT:sp.jailT,
      bankrupt:sp.bankrupt,props:sp.props.slice()
    });
  });
  players.length=s.players.length;
  current=s.current; rolled=s.rolled; moving=s.moving;
  turnEnding=s.turnEnding; doublesCount=s.doublesCount; lastWasDoubles=s.lastWasDoubles;
  if(fresh) spawnPieces();
  players.forEach((p,i)=>{ if(p.el) placePiece(p,p.pos,i); });
  renderPlayers();
  updateRollLabel();
}

/* ── HOST: broadcast helpers ────────────────────────────────── */
function netSync(){ if(NET.isHost()) NET.broadcast({t:'sync',s:snapshot()}); }

/* ── MESSAGE HANDLERS ───────────────────────────────────────── */
function hostHandle(msg,conn){
  if(msg.t==='join'){
    const seat=NET.lobby.length+1;              // host is seat 0
    if(seat>5){ if(conn&&conn.send) conn.send({t:'full'}); return; }
    NET.lobby.push({seat,name:msg.name||('Player '+(seat+1)),conn});
    if(conn&&conn.send) conn.send({t:'seat',seat,name:msg.name,host:NET.hostName});
    NET.broadcast({t:'lobby',host:NET.hostName,
                   list:NET.lobby.map(l=>({seat:l.seat,name:l.name}))});
    renderLobby();
    return;
  }
  if(msg.t==='intent'){
    // only the player whose turn it is may act
    if(msg.seat!==current && msg.a!=='chat') return;
    if(msg.a==='roll')       rollDice(true);
    else if(msg.a==='ok')    closeCard(true);
    else if(msg.a==='alt')   closeCardAlt(true);
    else if(msg.a==='sell')  sellProperty(msg.seat,msg.idx,true);
    return;
  }
}

function clientHandle(msg){
  switch(msg.t){
    case 'seat':   NET.seat=msg.seat; NET.hostName=msg.host||NET.hostName; renderLobby(); break;
    case 'lobby':  NET.lobby=msg.list; NET.hostName=msg.host||DEFAULT_NAMES[0]; renderLobby(); break;
    case 'start':  netStartGame(msg); break;
    case 'sync':   applySnapshot(msg.s); break;
    case 'log':    addLog(msg.m,msg.c); break;
    case 'toast':  toast(msg.m); break;
    case 'dice':   showDice(msg.d1,msg.d2); break;
    case 'move':   netAnimate(msg.i,msg.from,msg.to); break;
    case 'popup':  netShowPopup(msg); break;
    case 'close':  netClosePopup(); break;
    case 'winner': showWinner(players[msg.i]); break;
    case 'full':   alert(t('roomFull')); break;
  }
}

/* ── PEERJS CONNECTION ──────────────────────────────────────── */
function makeRoomCode(){
  const A='ABCDEFGHJKMNPQRSTUVWXYZ23456789';   // no confusable chars
  let s=''; for(let i=0;i<5;i++) s+=A[Math.floor(Math.random()*A.length)];
  return s;
}

function hostRoom(){
  if(typeof Peer==='undefined'){ netStatus(t('netNoLib'),'err'); return; }
  NET.mode='host'; NET.seat=0;
  NET.myName=((document.getElementById('online-name')||{}).value||'').trim()||DEFAULT_NAMES[0];
  NET.hostName=NET.myName;
  const code=makeRoomCode();
  NET.roomId=code;
  netStatus(t('netConnecting'));
  NET.peer=new Peer('mply-'+code,{debug:0});
  NET.peer.on('open',()=>{
    document.getElementById('room-code').textContent=code;
    document.getElementById('lobby-host').style.display='block';
    document.getElementById('online-choice').style.display='none';
    netStatus('');
    renderLobby();
  });
  NET.peer.on('connection',conn=>{
    NET.conns.push(conn);
    conn.on('data',m=>hostHandle(m,conn));
    conn.on('close',()=>{
      NET.conns=NET.conns.filter(c=>c!==conn);
      NET.lobby=NET.lobby.filter(l=>l.conn!==conn);
      renderLobby();
    });
  });
  NET.peer.on('error',e=>netStatus(t('netError')+': '+e.type,'err'));
}

function joinRoom(){
  if(typeof Peer==='undefined'){ netStatus(t('netNoLib'),'err'); return; }
  const code=(document.getElementById('join-code').value||'').trim().toUpperCase();
  if(code.length<4){ netStatus(t('netBadCode'),'err'); return; }
  NET.mode='client';
  NET.myName=((document.getElementById('online-name')||{}).value||'').trim();
  netStatus(t('netConnecting'));
  NET.peer=new Peer({debug:0});
  NET.peer.on('open',()=>{
    const conn=NET.peer.connect('mply-'+code,{reliable:true});
    NET.hostConn=conn;
    conn.on('open',()=>{
      conn.send({t:'join',name:NET.myName});
      document.getElementById('lobby-client').style.display='block';
      document.getElementById('online-choice').style.display='none';
      netStatus('');
    });
    conn.on('data',clientHandle);
    conn.on('close',()=>netStatus(t('netHostLeft'),'err'));
  });
  NET.peer.on('error',e=>netStatus(t('netError')+': '+e.type,'err'));
}

function netStatus(msg,cls){
  const el=document.getElementById('net-status');
  if(!el) return;
  el.textContent=msg||'';
  el.className=cls==='err'?'net-err':'';
}

/* ── LOBBY ──────────────────────────────────────────────────── */
function renderLobby(){
  const seats=[{seat:0,name:NET.hostName||DEFAULT_NAMES[0],host:true}];
  NET.lobby.forEach(l=>seats.push({seat:l.seat,name:l.name||DEFAULT_NAMES[l.seat]}));
  const html=seats.map(s=>
    `<div class="lobby-row">
       <span class="psetup-token" style="background:${PCOLORS[s.seat]}">${PAVATAR[s.seat]}</span>
       <span class="lobby-name">${s.name}${s.host?' <em>('+t('hostTag')+')</em>':''}${s.seat===NET.seat?' ◀ '+t('youTag'):''}</span>
     </div>`).join('');
  // both lobbies exist in the DOM; fill whichever is showing
  ['lobby-list','lobby-list-c'].forEach(id=>{
    const el=document.getElementById(id); if(el) el.innerHTML=html;
  });
  const cnt=document.getElementById('lobby-count');
  if(cnt) cnt.textContent=seats.length+' / 6';
  const sb=document.getElementById('btn-start-online');
  if(sb) sb.textContent=t('startGameOnline')+' ('+seats.length+')';
}

/* host presses Start: fill empty seats with AI and launch everywhere */
function hostStartOnline(){
  const humanSeats=1+NET.lobby.length;
  const total=Math.max(2,humanSeats);
  setupCount=total;
  setupNames=[]; setupTypes=[];
  for(let i=0;i<total;i++){
    const l=(i===0)?{name:NET.myName}:NET.lobby.find(x=>x.seat===i);
    setupNames[i]=l?l.name:'';
    setupTypes[i]=l?'human':'ai';
  }
  NET.broadcast({t:'start',names:setupNames,types:setupTypes,count:total,theme:THEME});
  closeSetup();
  beginGame();
  netSync();
}

/* client receives the host's start signal */
function netStartGame(msg){
  setupCount=msg.count; setupNames=msg.names; setupTypes=msg.types;
  if(msg.theme) applyTheme(msg.theme);
  closeSetup();
  beginGame();
}

function closeSetup(){
  const s=document.getElementById('setup');
  if(s) s.remove();
  const pi=document.getElementById('players-info'); if(pi) pi.style.display='flex';
  const lg=document.getElementById('log');          if(lg) lg.style.display='flex';
}

/* ── CLIENT-SIDE RENDER HELPERS ─────────────────────────────── */
function showDice(d1,d2){
  [d1,d2].forEach((val,idx)=>{
    const el=document.getElementById('d'+(idx+1));
    if(!el) return;
    el.style.setProperty('--rx','1080deg'); el.style.setProperty('--ry','1080deg');
    el.classList.remove('rolling','settled'); el.style.transform='';
    void el.offsetWidth; el.classList.add('rolling');
    setTimeout(()=>{
      el.classList.remove('rolling');
      el.style.transform='rotateX(0deg) rotateY(0deg)';
      const f=el.querySelector('.die-face.f1');
      if(f) f.innerHTML=PIP_HTML[val];
      el.classList.add('settled');
    },900);
  });
  if(typeof SFX!=='undefined') SFX.dice();
}

function netAnimate(i,from,to){
  const p=players[i];
  if(!p||!p.el) return;
  animatePiece(p,from,to,()=>{ renderPlayers(); });
}

/* a popup pushed from the host; only the acting seat gets live buttons */
function netShowPopup(msg){
  const mine=NET.controlsSeat(msg.seat);
  showEvent(msg.opts,
    mine?()=>NET.send({t:'intent',a:'ok',seat:NET.seat}):null,
    mine&&msg.hasAlt?()=>NET.send({t:'intent',a:'alt',seat:NET.seat}):null,
    true);
  // spectators see the card but can't act on it
  const ok=document.getElementById('card-close'), alt=document.getElementById('card-alt');
  if(ok)  ok.disabled=!mine;
  if(alt) alt.disabled=!mine;
  const wait=document.getElementById('card-waiting');
  if(wait) wait.textContent=mine?'':t('waitingFor')+' '+(players[msg.seat]?players[msg.seat].name:'');
}

function netClosePopup(){
  const o=document.getElementById('card-overlay');
  if(o) o.style.display='none';
  lastEvent=null; cardResolve=null; cardAltResolve=null;
}

}

/* ── AI ENGINE ── */
let aiTimer=null;
const AI_DELAY=900;          // pause so humans can follow along
const AI_RESERVE=120;        // keep this much cash on hand when buying

function isAITurn(){
  if(NET.isClient()) return false;            // only the host drives AI seats
  const p=players[current]; return !!(p&&p.isAI&&!p.bankrupt);
}
function popupOpen(){ const o=document.getElementById('card-overlay'); return o&&o.style.display==='flex'; }
function portfolioOpen(){ const o=document.getElementById('portfolio-overlay'); return o&&o.style.display==='flex'; }

function aiSchedule(fn,delay){
  clearTimeout(aiTimer);
  aiTimer=setTimeout(()=>{ aiTimer=null; fn(); }, delay===undefined?AI_DELAY:delay);
}

/* Should the AI buy the square it just landed on? */
function aiWantsToBuy(p,idx){
  const sq=SQ[idx];
  const after=p.money-sq.p;
  if(after<0) return false;

  // always grab railroads and utilities when affordable
  if(sq.t==='rail'||sq.t==='util') return after>=AI_RESERVE*0.5;

  // does buying complete or extend a colour group?
  const sameGroup=SQ.map((s,i)=>({s,i})).filter(o=>o.s.t==='prop'&&o.s.g===sq.g);
  const mine=sameGroup.filter(o=>p.props.includes(o.i)).length;
  const total=sameGroup.length;
  const opponentHas=sameGroup.some(o=>players.some(x=>x!==p&&x.props.includes(o.i)));

  if(mine===total-1 && !opponentHas) return after>=0;      // completes a monopoly – buy at any cost
  if(mine>0)  return after>=AI_RESERVE*0.6;                // extends a set – buy fairly eagerly
  if(opponentHas) return after>=AI_RESERVE*1.5;            // group already split – lower value
  return after>=AI_RESERVE;                                // fresh group – keep a buffer
}

/* Sell cheapest first until solvent */
function aiSellToSurvive(p){
  const idx=players.indexOf(p);
  if(p.money>=0 || p.props.length===0) return;
  const cheapest=p.props.slice().sort((a,b)=>SQ[a].p-SQ[b].p)[0];
  sellProperty(idx,cheapest);
  if(p.money<0 && p.props.length>0) aiSchedule(()=>aiSellToSurvive(p),600);
}

/* Central AI driver – called whenever the game hands control back */
function aiTick(){
  if(!isAITurn()) return;
  const p=players[current];

  // 1. a card / buy popup is waiting for a decision
  if(popupOpen()){
    aiSchedule(()=>{
      const alt=document.getElementById('card-alt');
      const hasChoice=alt&&alt.style.display!=='none';
      if(hasChoice && landedIdx!==null){
        if(aiWantsToBuy(p,landedIdx)) closeCard();      // primary = buy
        else closeCardAlt();                            // secondary = pass
      } else {
        closeCard();
      }
    });
    return;
  }

  // 2. forced to sell property to clear a debt
  if(p.money<0 && p.props.length>0){
    aiSchedule(()=>{ aiSellToSurvive(p); aiTick(); },700);
    return;
  }
  if(portfolioOpen()){ closePortfolio(); }

  // 3. normal turn: roll, then end
  const rollBtn=document.getElementById('btn-roll');
  if(rollBtn&&!rollBtn.disabled){ aiSchedule(()=>rollDice()); return; }
  // turns now advance on their own – nothing else for the AI to click
}

function spawnPieces(){
  const container=document.getElementById('board-container');
  players.forEach((p,i)=>{
    const el=document.createElement('div');
    el.className='piece';el.style.background=p.color;el.innerHTML='<span class="piece-face">'+p.initial+'</span>';
    container.appendChild(el);p.el=el;placePiece(p,0,i);
  });
}

function placePiece(p,sqIdx,offset){
  const{x,y}=sqPixelCenter(sqIdx);
  // 2 columns × 3 rows so all 6 tokens fit inside a 62px cell
  const cols=[-14,14], rows=[-24,0,24];
  const i=(offset||0)%6;
  const ox=cols[i%2], oy=rows[Math.floor(i/2)];
  p.el.style.left=(x+ox-13)+'px';
  p.el.style.top =(y+oy-13)+'px';
}

function animatePiece(p,fromSq,toSq,done){
  const steps=[];let s=fromSq;
  while(s!==toSq){s=(s+1)%40;steps.push(s);}
  let i=0;
  function step(){
    if(i>=steps.length){done();return;}
    const sq=steps[i++];p.pos=sq;
    placePiece(p,sq,players.indexOf(p));
    SFX.step();
    p.el.classList.remove('hopping');void p.el.offsetWidth;p.el.classList.add('hopping');
    setTimeout(step,i===steps.length?400:200);
  }
  step();
}

/* ── SELL ── */
// sell price = half of purchase price (standard Monopoly rule)
function sellProperty(playerIdx, sqIdx, relayed){
  if(NET.isClient()){
    if(NET.controlsSeat(playerIdx)) NET.send({t:'intent',a:'sell',seat:NET.seat,idx:sqIdx});
    return;
  }
  const p=players[playerIdx], sq=SQ[sqIdx];
  const salePrice=Math.floor(sq.p/2);
  p.props=p.props.filter(i=>i!==sqIdx);
  p.money+=salePrice;
  addLog(p.name+' '+t('soldW')+' '+sq.n+' $'+salePrice,'imp');
  SFX.sell();
  toast('🏷️ '+t('soldW')+' '+sq.n+' +$'+salePrice);
  // remove board outline
  const cell=document.getElementById('sq'+sqIdx);
  if(cell) cell.style.outline='';
  renderPlayers();
  if(p.money>=0){
    // Debt cleared – resume the game
    hideBrokeBanner();
    closePortfolio();
    const resolve=afterSellResolve;
    afterSellResolve=null;pendingDebt=0;
    if(typeof resolve==='function') resolve();
  } else if(p.props.length===0){
    // Sold everything and still can't cover – declare bankrupt
    declareBankrupt(p);
    closePortfolio();
  } else {
    // Still in the red, refresh portfolio so sold card disappears
    openPortfolio(playerIdx);
  }
}

let pendingDebt=0, afterSellResolve=null;

/* ── GAME LOGIC ── */
// Standard die pip layouts on a 3×3 grid
const PIP_HTML={
  1:'<i class="pip red p-mc"></i>',
  2:'<i class="pip p-tl"></i><i class="pip p-br"></i>',
  3:'<i class="pip p-tl"></i><i class="pip p-mc"></i><i class="pip p-br"></i>',
  4:'<i class="pip red p-tl"></i><i class="pip red p-tr"></i><i class="pip red p-bl"></i><i class="pip red p-br"></i>',
  5:'<i class="pip p-tl"></i><i class="pip p-tr"></i><i class="pip p-mc"></i><i class="pip p-bl"></i><i class="pip p-br"></i>',
  6:'<i class="pip p-tl"></i><i class="pip p-tr"></i><i class="pip p-ml"></i><i class="pip p-mr"></i><i class="pip p-bl"></i><i class="pip p-br"></i>',
};

function rollDice(relayed){
  if(!players.length)return;            // game hasn't started yet
  if(NET.isClient()){                   // clients never run rules – ask the host
    if(NET.myTurn()) NET.send({t:'intent',a:'roll',seat:NET.seat});
    return;
  }
  // the host may act for its own seat, for AI seats, or when relaying a
  // client's intent – but not for a remote human on a local click
  if(!relayed && NET.isOnline() && !NET.controlsSeat(current) && !players[current].isAI) return;
  if(rolled||moving||turnEnding)return;
  const rb=document.getElementById('btn-roll');
  if(rb&&rb.disabled)return;            // dice area is clickable too – honour the same gate
  if(popupOpen&&popupOpen())return;
  const p=players[current];
  const d1=Math.ceil(Math.random()*6),d2=Math.ceil(Math.random()*6),total=d1+d2;
  lastWasDoubles=(d1===d2);

  [d1,d2].forEach((val,idx)=>{
    const el=document.getElementById('d'+(idx+1));
    if(!el)return;
    // spin freely, then settle flat facing the viewer
    el.style.setProperty('--rx','1080deg');
    el.style.setProperty('--ry','1080deg');
    el.classList.remove('rolling','settled');
    el.style.transform='';
    void el.offsetWidth;
    el.classList.add('rolling');
    setTimeout(()=>{
      el.classList.remove('rolling');
      // snap to front and paint the rolled value on the front face
      el.style.transform='rotateX(0deg) rotateY(0deg)';
      const front=el.querySelector('.die-face.f1');
      if(front) front.innerHTML=PIP_HTML[val];
      el.classList.add('settled');
    },900);
  });

  SFX.dice();
  if(NET.isHost()) NET.broadcast({t:'dice',d1,d2});
  addLog(`${p.name} ${t('rolledW')} ${d1}+${d2} = ${total}`);
  rolled=true;moving=true;setCtrl(false,false,false);

  setTimeout(()=>{
    if(p.jail){
      if(d1===d2){p.jail=false;p.jailT=0;addLog(p.name+' '+t('doublesFree'),'imp');}
      else{
        p.jailT++;
        if(p.jailT>=3){p.money-=50;p.jail=false;p.jailT=0;addLog(p.name+' '+t('paidBail'),'imp');}
        else{addLog(p.name+' '+t('stillJail')+' ('+p.jailT+'/3)');moving=false;lastWasDoubles=false;renderPlayers();finishTurn(false);return;}
      }
    }
    // three doubles in a row → straight to jail
    if(lastWasDoubles){
      doublesCount++;
      if(doublesCount>=3){
        doublesCount=0;lastWasDoubles=false;moving=false;
        addLog(p.name+' '+t('threeDoubles'),'imp');
        showEvent({kind:'jail', titleKey:'goToJailT', title:t('goToJailT'), ico:'🚔',
                   text:t('threeDoublesText'), eff:t('moveToJail'), cls:'move'},
          ()=>{ p.pos=10;p.jail=true;p.jailT=0;placePiece(p,10,players.indexOf(p));
                renderPlayers(); finishTurn(true); });
        return;
      }
      addLog(p.name+' '+t('doublesAgain'),'imp');
    } else doublesCount=0;

    const from=p.pos,to=(p.pos+total)%40;
    if(NET.isHost()) NET.broadcast({t:'move',i:players.indexOf(p),from,to});
    animatePiece(p,from,to,()=>{
      moving=false;
      if(to<from){p.money+=200;SFX.go();addLog(p.name+' '+t('passedGo'),'imp');toast('🎉 '+t('passedGo'));}
      renderPlayers();handleLanding(p);
    });
  },1000);
}

function handleLanding(p){
  const sq=SQ[p.pos];landedIdx=p.pos;canBuy=false;hidePropCard();
  addLog('  → '+sqName(p.pos));
  // popup paths finish immediately (the player already acknowledged); quiet paths pause first
  const resume=(hadPopup)=>()=>{renderPlayers();finishTurn(hadPopup!==false);};

  if(sq.t==='gotojail'){
    addLog(p.name+' → '+t('GOTOJAIL')+' 🚔','imp');
    showEvent({
      kind:'jail', titleKey:'goToJailT', title:t('goToJailT'), ico:'🚔',
      text:t('goToJailText'),
      eff:t('moveToJail'), cls:'move'
    },()=>{
      p.pos=10;p.jail=true;p.jailT=0;placePiece(p,10,players.indexOf(p));
      resume(true)();
    });
    return;
  }

  if(sq.t==='tax'){
    addLog(p.name+' '+t('paidTax')+' $'+sq.p,'imp');
    showEvent({
      kind:'tax', title:'💰 '+sqName(p.pos), ico:sq.n.indexOf('Luxury')>=0?'💎':'🧾',
      text:(sq.n.indexOf('Luxury')>=0?t('luxuryTaxText'):t('incomeTaxText'))+' $'+sq.p+'.',
      eff:'−$'+sq.p, cls:'loss', btnKey:'pay', btn:t('pay')
    },()=>{
      p.money-=sq.p;SFX.pay();
      renderPlayers();
      checkBankrupt(p,resume(true));
    });
    return;
  }

  if(sq.t==='chance'||sq.t==='chest'){doCard(p,sq.t,resume(true));return;}
  if(sq.t==='free'||sq.t==='go'||sq.t==='jail'){finishTurn(false);return;}

  if(sq.t==='prop'||sq.t==='rail'||sq.t==='util'){
    const owner=players.find(pl=>pl.props.includes(p.pos));
    if(!owner){
      if(p.money>=sq.p){
        addLog('  '+t('forSaleLog')+' $'+sq.p);
        const bandCol=sq.t==='prop'?(GROUPS[sq.c]||'#999'):sq.t==='rail'?'#444':'#5c8a3c';
        const ico=sq.t==='rail'?'🚂':sq.t==='util'?utilIco(p.pos):'🏠';
        let rows='';
        if(sq.t==='prop'){
          const labels=[t('baseRent'),t('fullSet'),'1 '+t('house'),'2 '+t('houses'),'3 '+t('houses'),'4 '+t('houses'),t('hotel')];
          rows=sq.r.map((v,i)=>`<tr><td>${labels[i]}</td><td>$${v}</td></tr>`).join('');
        } else if(sq.t==='rail'){
          rows=[1,2,3,4].map(n=>`<tr><td>${n} ${n>1?t('railroadsW'):t('railroadW')}</td><td>$${25*Math.pow(2,n-1)}</td></tr>`).join('');
        } else {
          rows='<tr><td>1 '+t('utilityW')+'</td><td>$60</td></tr><tr><td>2 '+t('utilityW')+'</td><td>$120</td></tr>';
        }
        const deed=`<tr><td><strong>${t('purchasePrice')}</strong></td><td><strong>$${sq.p}</strong></td></tr>${rows}`;
        showEvent({
          kind:'buy', title:t('forSaleT'), ico:ico, band:bandCol,
          text:sq.n,
          eff:t('yourCash')+': $'+p.money+'  →  $'+(p.money-sq.p),
          cls:'move', deed:deed,
          btn:t('buyFor')+' $'+sq.p, btn2Key:'pass', btn2:t('pass')
        },
        ()=>{ buyProp(); },        // primary: buy
        ()=>{ addLog('  '+p.name+' '+t('passedOnW')+' '+sq.n); renderPlayers(); finishTurn(true); }  // secondary: pass
        );
      }
      else{
        addLog('  '+t('cannotAfford'));
        showEvent({
          kind:'buy', title:t('forSaleT'), ico:'🚫',
          text:sq.n+' '+t('costsW')+' $'+sq.p+'.',
          eff:t('notEnough')+' ($'+p.money+')', cls:'loss'
        },resume(true));
      }
    }else if(owner===p){addLog('  '+t('yourProperty'));finishTurn(false);}
    else{
      const rent=calcRent(p.pos,owner);
      addLog(p.name+' '+t('paidRentTo')+' '+owner.name+' $'+rent,'imp');
      const ico=sq.t==='rail'?'🚂':sq.t==='util'?utilIco(p.pos):'🏠';
      showEvent({
        kind:'rent', title:t('payRentT'), ico:ico,
        text:sq.n+' '+t('ownedBy')+' '+owner.name+'.',
        eff:'−$'+rent+'  →  '+owner.name, cls:'loss', btnKey:'payRent', btn:t('payRent')
      },()=>{
        p.money-=rent;owner.money+=rent;SFX.pay();
        renderPlayers();
        checkBankrupt(p,resume(true));
      });
    }
    return;
  }
  finishTurn(false);
}

function calcRent(idx,owner){
  const sq=SQ[idx];
  if(sq.t==='rail'){const n=owner.props.filter(i=>SQ[i].t==='rail').length;return 25*Math.pow(2,n-1);}
  if(sq.t==='util'){const n=owner.props.filter(i=>SQ[i].t==='util').length;return n===2?120:60;}
  const mono=SQ.every((s,i)=>s.g!==sq.g||owner.props.includes(i));
  return sq.r[mono?1:0];
}

/* Generic event popup.
   opts: {kind, title, ico, text, eff, cls, btn, btn2, band, deed}
   onOk  runs on the primary button, onAlt on the secondary one. */
function showEvent(opts, onOk, onAlt, silent){
  lastEvent={opts,onOk,onAlt};
  const head=document.getElementById('card-head');
  head.className=opts.kind||'chest';
  // re-derive translatable pieces so a language switch updates a live popup
  if(opts.cardId){ opts.text=ct(opts.cardId); opts.title=opts.kind==='chance'?t('chanceT'):t('chestT'); }
  if(opts.titleKey) opts.title=t(opts.titleKey);
  if(opts.btnKey)   opts.btn=t(opts.btnKey);
  if(opts.btn2Key)  opts.btn2=t(opts.btn2Key);
  head.textContent=opts.title;

  const band=document.getElementById('card-band');
  if(opts.band){band.style.display='block';band.style.background=opts.band;}
  else band.style.display='none';

  const icoEl=document.getElementById('card-icon');
  icoEl.textContent=opts.ico||'';
  icoEl.style.display=opts.ico?'block':'none';

  document.getElementById('card-text').textContent=opts.text||'';
  const eff=document.getElementById('card-effect');
  eff.textContent=opts.eff||'';
  eff.className=opts.cls||'';

  const deed=document.getElementById('card-deed');
  if(opts.deed){deed.style.display='table';deed.innerHTML=opts.deed;}
  else deed.style.display='none';

  document.getElementById('card-close').textContent=opts.btn||t('ok');
  const alt=document.getElementById('card-alt');
  if(opts.btn2){alt.style.display='block';alt.textContent=opts.btn2;}
  else alt.style.display='none';

  document.getElementById('card-overlay').style.display='flex';
  if(NET.isHost()&&!silent)
    NET.broadcast({t:'popup',opts,hasAlt:!!opts.btn2,seat:current});
  if(!silent){ if(opts.kind==='jail')SFX.jail(); else SFX.card(); }
  setCtrl(false,false,false);
  cardResolve=onOk||null;
  cardAltResolve=onAlt||null;
  if(!silent && typeof aiTick==='function') aiTick();
}

function closeCard(relayed){
  if(NET.isClient()){ if(NET.myTurn()) NET.send({t:'intent',a:'ok',seat:NET.seat}); return; }
  if(NET.isHost()) NET.broadcast({t:'close'});
  lastEvent=null;
  document.getElementById('card-overlay').style.display='none';
  const r=cardResolve;cardResolve=null;cardAltResolve=null;
  if(typeof r==='function') r();
}

function closeCardAlt(relayed){

function doCard(p,type,onClear){
  const deck=type==='chance'?CHANCE_CARDS:CHEST_CARDS;
  const c=deck[Math.floor(Math.random()*deck.length)];
  const cText=ct(c.id);
  addLog('  '+(type==='chance'?'❓':'📦')+' '+cText,'imp');
  showEvent({
    kind:type, cardId:c.id,
    title:type==='chance'?t('chanceT'):t('chestT'),
    ico:c.ico, text:cText, eff:c.eff, cls:c.cls
  },()=>{
    c.fn(p);
    if(c.cls==='gain') SFX.coin();
    else if(c.cls==='loss') SFX.pay();
    else if(c.eff==='Go to Jail') SFX.jail();
    renderPlayers();
    checkBankrupt(p,onClear);
  });
}

function buyProp(){
  const p=players[current];
  if(landedIdx===null)return;
  const sq=SQ[landedIdx];
  if(p.money<sq.p)return;
  p.money-=sq.p;p.props.push(landedIdx);canBuy=false;
  SFX.buy();
  addLog(p.name+' '+t('boughtW')+' '+sq.n+' $'+sq.p,'imp');toast('🏠 '+t('boughtW')+' '+sq.n);
  hidePropCard();renderPlayers();finishTurn(true);
}



/* ── SQUARE INSPECTOR ──
   Click any buyable square to see its deed and, if taken, who owns it. */
function inspectSquare(idx){
  if(!players.length) return;
  if(popupOpen&&popupOpen()) return;   // a real decision is pending – don't hijack it
  if(moving||turnEnding) return;       // mid-animation
  const sq=SQ[idx];
  const owner=players.find(pl=>pl.props.includes(idx));
  const bandCol = sq.t==='prop' ? (GROUPS[sq.c]||'#999')
                : sq.t==='rail' ? '#444' : '#5c8a3c';
  const ico = sq.t==='rail' ? '🚂'
            : sq.t==='util' ? utilIco(idx) : '🏠';

  // rent table
  let rows='';
  if(sq.t==='prop'){
    const labels=[t('baseRent'),t('fullSet'),'1 '+t('house'),'2 '+t('houses'),
                  '3 '+t('houses'),'4 '+t('houses'),t('hotel')];
    // highlight the tier actually in force for the current owner
    let active=-1;
    if(owner){
      const full=SQ.every((o,i)=>o.g!==sq.g||o.t!=='prop'||owner.props.includes(i));
      active=full?1:0;
    }
    rows=sq.r.map((v,i)=>
      `<tr><td>${labels[i]}</td><td${i===active?' style="color:#1b3a0a;font-weight:700"':''}>$${v}</td></tr>`).join('');
  } else if(sq.t==='rail'){
    const n=owner?owner.props.filter(i=>SQ[i].t==='rail').length:0;
    rows=[1,2,3,4].map(k=>
      `<tr><td>${k} ${k>1?t('railroadsW'):t('railroadW')}</td><td${k===n?' style="color:#1b3a0a;font-weight:700"':''}>$${25*Math.pow(2,k-1)}</td></tr>`).join('');
  } else {
    const n=owner?owner.props.filter(i=>SQ[i].t==='util').length:0;
    rows=`<tr><td>1 ${t('utilityW')}</td><td${n===1?' style="color:#1b3a0a;font-weight:700"':''}>$60</td></tr>`+
         `<tr><td>2 ${t('utilityW')}</td><td${n===2?' style="color:#1b3a0a;font-weight:700"':''}>$120</td></tr>`;
  }
  const deed=`<tr><td><strong>${t('purchasePrice')}</strong></td><td><strong>$${sq.p}</strong></td></tr>${rows}`;

  // owner line
  let effHtml, cls;
  if(owner){
    effHtml=owner.name;          // name already carries the token emoji
    cls='move';
  } else {
    effHtml=t('unowned');
    cls='';
  }

  showEvent({
    kind:'buy', title:(owner?t('ownedTitle'):t('unownedTitle')), ico:ico, band:bandCol,
    text:sq.n,
    eff:(owner?t('ownerLabel')+': '+effHtml:effHtml), cls:cls,
    deed:deed, btnKey:'close', btn:t('close')
  }, ()=>{ restoreAfterInspect(); }, null, true);
}

/* the inspector is a read-only view – put controls back exactly as they were */
function restoreAfterInspect(){
  renderPlayers();
  const canRoll = players.length && !rolled && !moving && !turnEnding &&
                  !(players[current] && players[current].bankrupt);
  setCtrl(!!canRoll,false,false);
}

/* ── TURN FLOW ──
   finishTurn() replaces the old "End Turn" button. It is the single point every
   landing path converges on.  hadPopup=true  → the player already acknowledged
   something, so advance right away.  hadPopup=false → pause so the log is readable. */
let turnEnding=false, doublesCount=0, lastWasDoubles=false;
const QUIET_PAUSE=1200;

function finishTurn(hadPopup){
  if(turnEnding) return;
  const p=players[current];

  // never advance while the player still owes money and can sell to cover it
  if(p && p.money<0 && p.props.length>0) return;

  // doubles → same player rolls again instead of the turn passing
  if(lastWasDoubles && p && !p.jail && !p.bankrupt){
    lastWasDoubles=false;
    rolled=false; landedIdx=null; hidePropCard();
    setCtrl(true,false,false);
    renderPlayers();
    return;
  }

  turnEnding=true;
  setCtrl(false,false,false);
  setTimeout(()=>{ turnEnding=false; endTurn(); }, hadPopup?250:QUIET_PAUSE);
}

function endTurn(){
  hidePropCard();rolled=false;canBuy=false;landedIdx=null;
  doublesCount=0;lastWasDoubles=false;
  [1,2].forEach(n=>{
    const el=document.getElementById('d'+n);
    if(el){el.classList.remove('rolling','settled');el.style.transform='rotateX(0deg) rotateY(0deg)';}
  });
  const alive=players.filter(p=>!p.bankrupt);
  if(alive.length<=1){showWinner(alive[0]||players.reduce((a,b)=>a.money>b.money?a:b));return;}
  do{current=(current+1)%players.length;}while(players[current].bankrupt);
  addLog('── '+players[current].name+t('turnOf')+' ──','sep');
  setCtrl(true,false,false);renderPlayers();updateRollLabel();
}

function checkBankrupt(p, onClear){
  if(p.money>=0){ if(onClear) onClear(); return; }
  // Player is in the red – do they have properties to sell?
  const totalAssets=p.props.reduce((s,i)=>s+Math.floor(SQ[i].p/2),0);
  if(p.props.length>0 && p.money+totalAssets>=0){
    // Can survive by selling – enter sell mode
    pendingDebt=Math.abs(p.money);
    afterSellResolve=()=>{
      renderPlayers();
      if(onClear) onClear();
    };
    addLog(p.name+' '+t('mustSell')+' ($'+p.money+')','imp');
    toast('⚠️ '+p.name+' must sell to pay debts!');
    showBrokeBanner();
    setCtrl(false,false,false);
    openPortfolio(players.indexOf(p));
  } else {
    // Can't recover even by selling everything
    declareBankrupt(p);
    if(onClear) onClear();
  }
}

function declareBankrupt(p){
  p.money=0;p.bankrupt=true;
  // return properties to bank (unowned)
  p.props.forEach(i=>{ const c=document.getElementById('sq'+i); if(c) c.style.outline=''; });
  p.props=[];
  pendingDebt=0;afterSellResolve=null;
  hideBrokeBanner();
  SFX.bankrupt();
  addLog(p.name+' '+t('wentBankrupt')+' 💀','imp');toast(p.name+' '+t('wentBankrupt'));
  renderPlayers();
  const alive=players.filter(x=>!x.bankrupt);
  if(alive.length===1) showWinner(alive[0]);
}

function showWinner(w){
  if(NET.isHost()) NET.broadcast({t:'winner',i:players.indexOf(w)});
  turnEnding=false;
  if(typeof aiTimer!=='undefined') clearTimeout(aiTimer);
  SFX.win();
  document.getElementById('wt').textContent='🏆 '+w.name+' '+t('winsW');
  document.getElementById('wm').textContent=t('finalW')+': $'+w.money+' · '+w.props.length+' '+t('propsPl');
  document.getElementById('winner').style.display='flex';
}

function showPropCard(sq){
  const el=document.getElementById('prop-card');el.style.display='block';
  const col=sq.t==='prop'?(GROUPS[sq.c]||'#999'):'#888';
  let rows='';
  if(sq.t==='prop'){['Base','Full set','1 house','2 houses','3 houses','4 houses','Hotel'].forEach((l,i)=>{rows+=`<tr><td>${l}</td><td>$${sq.r[i]}</td></tr>`;});}
  else if(sq.t==='rail'){rows='<tr><td>1 rail</td><td>$25</td></tr><tr><td>2 rails</td><td>$50</td></tr><tr><td>3 rails</td><td>$100</td></tr><tr><td>4 rails</td><td>$200</td></tr>';}
  else if(sq.t==='util'){rows='<tr><td>1 utility</td><td>$60</td></tr><tr><td>Both</td><td>$120</td></tr>';}
  el.innerHTML=`<div class="pc-title">${sq.n}</div><div class="pc-band" style="background:${col}"></div><table><tr><td>Price</td><td>$${sq.p}</td></tr>${rows}</table>`;
}

/* ── SOUND ENGINE (Web Audio – no external files) ── */
let audioCtx=null, soundOn=true;
function AC(){
  if(!audioCtx){
    try{ audioCtx=new (window.AudioContext||window.webkitAudioContext)(); }
    catch(e){ return null; }
  }
  if(audioCtx.state==='suspended') audioCtx.resume();
  return audioCtx;
}

// simple tone
function tone(freq,dur,type='sine',vol=.2,delay=0){
  if(!soundOn)return;
  const ctx=AC(); if(!ctx)return;
  const t=ctx.currentTime+delay;
  const o=ctx.createOscillator(), g=ctx.createGain();
  o.type=type; o.frequency.setValueAtTime(freq,t);
  g.gain.setValueAtTime(0,t);
  g.gain.linearRampToValueAtTime(vol,t+.01);
  g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  o.connect(g); g.connect(ctx.destination);
  o.start(t); o.stop(t+dur+.02);
}

// filtered noise burst – used for dice rattle
function noise(dur,vol=.15,delay=0,freq=1200){
  if(!soundOn)return;
  const ctx=AC(); if(!ctx)return;
  const t=ctx.currentTime+delay;
  const len=Math.floor(ctx.sampleRate*dur);
  const buf=ctx.createBuffer(1,len,ctx.sampleRate);
  const data=buf.getChannelData(0);
  for(let i=0;i<len;i++) data[i]=(Math.random()*2-1)*(1-i/len);
  const src=ctx.createBufferSource(); src.buffer=buf;
  const bp=ctx.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value=freq; bp.Q.value=1.2;
  const g=ctx.createGain(); g.gain.value=vol;
  src.connect(bp); bp.connect(g); g.connect(ctx.destination);
  src.start(t);
}

const SFX={
  dice(){ // rattling tumble then a settle click
    for(let i=0;i<9;i++) noise(.06,.10,i*.09,700+Math.random()*1400);
    noise(.09,.20,.86,500);
    tone(180,.09,'square',.10,.87);
  },
  step(){ tone(620,.05,'square',.05); },      // piece hop
  buy(){ tone(523,.12,'triangle',.18); tone(659,.12,'triangle',.18,.10); tone(784,.20,'triangle',.18,.20); },
  sell(){ tone(500,.12,'triangle',.16); tone(400,.16,'triangle',.16,.10); },
  coin(){ tone(988,.08,'square',.13); tone(1319,.14,'square',.13,.07); },   // money in
  pay(){ tone(300,.16,'sawtooth',.14); tone(200,.24,'sawtooth',.14,.12); }, // money out
  card(){ noise(.14,.12,0,2600); tone(700,.10,'sine',.10,.05); },
  jail(){ tone(220,.22,'square',.16); tone(165,.34,'square',.16,.18); },
  go(){ tone(659,.12,'sine',.18); tone(784,.12,'sine',.18,.10); tone(1047,.26,'sine',.18,.20); },
  bankrupt(){ tone(392,.22,'sawtooth',.16); tone(311,.22,'sawtooth',.16,.18); tone(233,.44,'sawtooth',.16,.36); },
  win(){ [523,659,784,1047,1319].forEach((f,i)=>tone(f,.30,'triangle',.20,i*.13)); },
  click(){ tone(800,.04,'square',.07); },
};

function toggleSound(){
  soundOn=!soundOn;
  const b=document.getElementById('sound-toggle');
  if(b) b.textContent=soundOn?t('sound'):t('muted');
  if(soundOn) SFX.click();
}

/* ── RESTART ── */
function confirmRestart(){
  if(typeof SFX!=='undefined') SFX.click();
  if(!players.length){ location.reload(); return; }   // still on the setup screen
  showEvent({
    kind:'jail', titleKey:'restartTitle', title:t('restartTitle'), ico:'↻',
    text:t('restartText'), eff:'', cls:'',
    btnKey:'restartYes', btn:t('restartYes'),
    btn2Key:'restartNo', btn2:t('restartNo')
  },
  ()=>{ location.reload(); },
  ()=>{ /* cancelled – hand control back to whoever's turn it is */
        renderPlayers(); setCtrl(!rolled&&!moving&&!turnEnding,false,false); },
  true);   // silent: no card sound, don't wake the AI
}


/* ── FIT THE BOARD TO THE VIEWPORT ──
   The board's geometry is fixed in pixels (piece placement depends on it),
   so we scale the scene rather than reflowing the grid. */
const BOARD_PX=782;
function fitBoard(){
  const wrap=document.getElementById('board-wrap');
  const scene=document.getElementById('scene');
  if(!wrap||!scene) return;
  // width the board may occupy: viewport minus body padding, capped at natural size
  const vw=(window&&window.innerWidth)||1280;
  const pad=(vw<=720)?16:32;
  let avail=Math.min(vw-pad, 1080);
  // side-by-side layout leaves room for the panel
  if(vw>1040) avail=Math.min(avail-246, BOARD_PX);
  const scale=Math.max(0.34, Math.min(1, avail/BOARD_PX));
  scene.style.transform='scale('+scale+')';
  // the scaled element still reserves its unscaled box, so size the wrapper
  wrap.style.width=(BOARD_PX*scale)+'px';
  wrap.style.height=(BOARD_PX*scale)+'px';
}
if(window&&window.addEventListener){
  window.addEventListener('resize',fitBoard);
  window.addEventListener('orientationchange',()=>setTimeout(fitBoard,150));
}

/* ── 3D TOGGLE ── */
let is3d=false;
let boardRot=0;                       // 0 / 90 / 180 / 270

function rotateBoard(delta){
  if(!is3d) return;
  boardRot=(boardRot+delta+360)%360;
  applyBoardRotation();
  if(typeof SFX!=='undefined') SFX.click();
}

const BOARD_TILT=50;                  // must match the rotateX in .view3d

function applyBoardRotation(){
  const bc=document.getElementById('board-container');
  if(!bc) return;
  const on=is3d;
  bc.style.setProperty('--board-rot', (on?boardRot:0)+'deg');
  // tokens spin the opposite way so their emoji stays upright
  bc.style.setProperty('--token-counter', (on?-boardRot:0)+'deg');
  // depth cues – only meaningful once the board is tilted
  bc.style.setProperty('--tilt',        (on?BOARD_TILT:0)+'deg');
  bc.style.setProperty('--tok-rise',    (on?11:0)+'px');   // token stands this tall
  bc.style.setProperty('--tok-solid',   on?'1':'0');       // pedestal + contact shadow
  bc.style.setProperty('--dice-lift',   (on?28:0)+'px');   // half the cube, so it rests on the board
  bc.style.setProperty('--dice-shadow', on?'1':'0');
}

function toggle3d(){
  is3d=!is3d;
  const bc=document.getElementById('board-container');
  const btn=document.getElementById('view-toggle');
  bc.classList.toggle('view3d',is3d);
  const bw=document.getElementById('board-wrap');
  if(bw) bw.classList.toggle('is3d',is3d);
  btn.textContent=is3d?t('viewFlat'):t('view3d');
  // rotation only makes sense in 3D – show the controls with the view
  ['rot-left','rot-right'].forEach(id=>{
    const b=document.getElementById(id);
    if(b) b.style.display=is3d?'':'none';
  });
  if(!is3d) boardRot=0;               // flat view always sits square
  applyBoardRotation();
}

applyTheme('classic');
buildBoard();
applyLang();
updateRollLabel();
applyBoardRotation();
fitBoard();
